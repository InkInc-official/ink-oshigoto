<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FA0B8"/>
      <stop offset="45%" stop-color="#5A6C8C"/>
      <stop offset="100%" stop-color="#232B4D"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C7D3E2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C7D3E2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="#F7F3EA"/>

  <!-- ambient glow behind heart -->
  <circle cx="64" cy="62" r="46" fill="url(#haze)"/>

  <!-- signature: ink-drop heart -->
  <path d="M64 100
           C40 84 24 68 24 50
           C24 36 34 26 47 26
           C55 26 61 30 64 37
           C67 30 73 26 81 26
           C94 26 104 36 104 50
           C104 68 88 84 64 100
           Z"
        fill="url(#heart)"/>

  <!-- ink highlight -->
  <ellipse cx="46" cy="44" rx="8" ry="11" fill="#EAF0F7" opacity="0.35"/>
</svg>
